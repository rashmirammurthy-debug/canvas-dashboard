name: School Feed

on:
  schedule:
    - cron: '15 11 * * *'   # 7:15 AM ET daily (6:15 AM in winter)
  workflow_dispatch:         # lets you trigger it manually from GitHub
    inputs:
      catchup:
        description: 'Catch-up: treat the last 14 days of school emails as new'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser anthropic

      - name: Send school update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          SCHOOL_EMAIL_TO: ${{ secrets.SCHOOL_EMAIL_TO }}
          SCHOOL_RULES: ${{ secrets.SCHOOL_RULES }}
          SCHOOL_LABEL: School
          SCHOOL_CATCHUP: ${{ inputs.catchup }}
          TIMEZONE: America/New_York
          CALENDAR_GUESTS: ${{ secrets.CALENDAR_GUESTS }}   # optional: emails to invite from the + Calendar links
        run: python school_feed.py
