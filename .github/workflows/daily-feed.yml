name: Daily Feed

on:
  schedule:
    - cron: '0 11 * * *'   # 7 AM ET daily (6 AM in winter)
  workflow_dispatch:         # lets you trigger it manually from GitHub

permissions:
  contents: write            # needed to commit seen.json

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser anthropic

      - name: Send daily feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          NEWSLETTER_LABEL: Newsletters
          INBOX_REMINDERS: 'true'   # set to 'false' to stop sending inbox emails to Claude for reminders
          WEATHER_CITIES: 'Lexington, Massachusetts; Boston, Massachusetts'  # separate places with ;
          TIMEZONE: America/New_York
        run: python daily_feed.py

      - name: Save what was sent
        run: |
          git config user.email "rashmi.rammurthy@gmail.com"
          git config user.name "rashmirammurthy-debug"
          git add seen.json
          git diff --staged --quiet || (git commit -m "update seen items" && git push)
